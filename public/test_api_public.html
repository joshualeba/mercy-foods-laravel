<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Pública - Mercy Foods</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6347;
            --main-bg: #F7F8FC;
            --card-bg: #FFFFFF;
            --text-color-dark: #374151;
            --text-color-light: #6B7280;
            --border-color: #E5E7EB;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color-dark);
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-color-dark);
            margin-bottom: 0.5rem;
        }

        .header .subtitle {
            color: var(--text-color-light);
            font-size: 1.1rem;
        }

        .header .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .right-column {
            position: sticky;
            top: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.07);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            background-color: rgba(255, 99, 71, 0.2);
            color: var(--primary-color);
        }

        .card-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-color-dark);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-color-dark);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--main-bg);
            color: var(--text-color-dark);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 99, 71, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            margin-top: 0.5rem;
            background-color: var(--primary-color);
            color: white;
        }

        .btn:hover {
            background-color: #e55539;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 99, 71, 0.3);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .status-waiting {
            background-color: rgba(107, 114, 128, 0.2);
            color: var(--text-color-light);
        }

        .status-success {
            background-color: rgba(40, 167, 69, 0.2);
            color: var(--success-color);
        }

        .json-output {
            background: #2d2d2d;
            color: #50fa7b;
            padding: 1.5rem;
            border-radius: 10px;
            min-height: 500px;
            max-height: 80vh;
            overflow: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .note {
            background-color: rgba(40, 167, 69, 0.1);
            border-left: 4px solid var(--success-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-color-light);
        }

        @media (max-width: 968px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .right-column {
                position: static;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="/multimedia/logo.png" alt="Mercy Foods" class="logo">
            <h1>API Pública - Restaurantes y Platillos</h1>
            <p class="subtitle">Endpoints públicos sin necesidad de autenticación</p>
        </div>

        <div class="grid">
            <!-- Columna Izquierda -->
            <div class="left-column">
                <!-- Restaurantes -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">R</div>
                        <h2>Restaurantes</h2>
                    </div>
                    <p class="note">✓ Sin autenticación requerida</p>

                    <button class="btn" onclick="getRestaurantes()">GET /api/restaurantes</button>

                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label>ID del Restaurante</label>
                        <input type="number" id="restauranteId" placeholder="Ej: 2" min="1">
                    </div>
                    <button class="btn" onclick="getRestaurante()">GET /api/restaurantes/{id}</button>
                    <button class="btn" onclick="getPlatillosRestaurante()">GET
                        /api/restaurantes/{id}/platillos</button>
                </div>

                <!-- Platillos -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">P</div>
                        <h2>Platillos</h2>
                    </div>
                    <p class="note">✓ Sin autenticación requerida</p>

                    <button class="btn" onclick="getPlatillos()">GET /api/platillos</button>

                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label>ID del Platillo</label>
                        <input type="number" id="platilloId" placeholder="Ej: 1" min="1">
                    </div>
                    <button class="btn" onclick="getPlatillo()">GET /api/platillos/{id}</button>
                </div>
            </div>

            <!-- Columna Derecha - Respuesta -->
            <div class="right-column">
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">→</div>
                        <h2>Respuesta del Servidor</h2>
                    </div>
                    <div id="statusBadge" class="status-badge status-waiting">Esperando petición...</div>
                    <div class="json-output" id="jsonOutput">// Aquí aparecerá la respuesta de la API en formato JSON...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showResponse(data, status) {
            const output = document.getElementById('jsonOutput');
            const badge = document.getElementById('statusBadge');

            output.textContent = JSON.stringify(data, null, 4);

            if (status >= 200 && status < 300) {
                badge.className = 'status-badge status-success';
                badge.textContent = '✓ Status: ' + status + ' OK';
            } else {
                badge.className = 'status-badge status-error';
                badge.textContent = '✗ Status: ' + status + ' Error';
            }
        }

        async function getRestaurantes() {
            try {
                const res = await fetch('/api/restaurantes');
                const data = await res.json();
                showResponse(data, res.status);
            } catch (err) {
                showResponse({ error: err.message }, 500);
            }
        }

        async function getRestaurante() {
            const id = document.getElementById('restauranteId').value;
            if (!id) {
                showResponse({ error: 'Por favor ingresa un ID de restaurante' }, 400);
                return;
            }

            try {
                const res = await fetch(`/api/restaurantes/${id}`);
                const data = await res.json();
                showResponse(data, res.status);
            } catch (err) {
                showResponse({ error: err.message }, 500);
            }
        }

        async function getPlatillosRestaurante() {
            const id = document.getElementById('restauranteId').value;
            if (!id) {
                showResponse({ error: 'Por favor ingresa un ID de restaurante' }, 400);
                return;
            }

            try {
                const res = await fetch(`/api/restaurantes/${id}/platillos`);
                const data = await res.json();
                showResponse(data, res.status);
            } catch (err) {
                showResponse({ error: err.message }, 500);
            }
        }

        async function getPlatillos() {
            try {
                const res = await fetch('/api/platillos');
                const data = await res.json();
                showResponse(data, res.status);
            } catch (err) {
                showResponse({ error: err.message }, 500);
            }
        }

        async function getPlatillo() {
            const id = document.getElementById('platilloId').value;
            if (!id) {
                showResponse({ error: 'Por favor ingresa un ID de platillo' }, 400);
                return;
            }

            try {
                const res = await fetch(`/api/platillos/${id}`);
                const data = await res.json();
                showResponse(data, res.status);
            } catch (err) {
                showResponse({ error: err.message }, 500);
            }
        }
    </script>
</body>

</html>
